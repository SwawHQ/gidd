[zh-CN."*"]
title = "确认 Issue"
body = '''
根据用户要求选择工作流程，并确认目标仓库当前检出的分支就是本次目标分支。已有 Issue 时，可用 `gidd <Issue编号> --flow <工作流程>` 登记任务并准备工作区。

需要新建 Issue 时，为本次任务单独准备 Markdown 草稿。第一个非空行用 `# 标题`，随后按上方的 Issue 模板填写正文，无需空行分隔。可用 `gidd issue --file <文件> --flow <工作流程>` 创建 Issue、登记任务并准备工作区。命令返回 Issue 编号、地址和工作区状态，并保留输入文件。处理已有 Issue 时保留原标题。

创建结果不明时，先查询交付仓库；若 Issue 已存在，用 `gidd <Issue编号> --flow <工作流程>` 继续，不要重复创建。已知编号但准备中断时，修复问题后重复执行编号命令。

登记后若需修改工作流程，可用 `gidd <Issue编号>.flow.set <工作流程>`。工作区已准备后，只能修改同一交付模式内的工作流程。准备中断时，可用 `gidd <Issue编号>.cleanup` 撤销未完成的工作区准备，保留任务记录和 GitHub 上的 Issue，再用编号命令继续。

GitHub 上的 Issue 保存需求和验收记录。内容有变化时更新 Issue；修改本地副本不会自动更新远端。
'''

