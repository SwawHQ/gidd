[zh-CN."*direct-merge"]
title = "本地合并受阻"
body = '''
处理合并冲突、目标分支状态变化或合并后未包含预期成果等问题，保留用户及并行任务的改动。
解决过程中产生的修改重新核对验收，提交和再次合并仍遵守相应环节的要求。
无法继续时，说明阻碍并保留现场。
'''

[zh-CN."*pr-merge"]
title = "PR 合并受阻"
body = '''
处理检查或 Action 失败、审阅未通过、合并冲突，以及目标分支未收到交付等问题；不以绕过仓库合并要求代替解决问题。
涉及修改、验收、提交或重新推送时，仍遵守相应环节的要求，更新 PR 后重新确认合并条件。
需要等待或无法继续时，说明具体阻碍及所需条件，保留现场。
'''

