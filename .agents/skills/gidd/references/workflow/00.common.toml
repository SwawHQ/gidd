[zh-CN."*"]
title = "公共执行规则"
body = '''
1. 使用目标仓库已配置的 gidd.link .git、gidd.link .gh 操作 Git 和 GitHub；在目标仓库或已登记的专用 worktree 内调用原入口，沿用其配置，命令按调用目录执行。也可用 .git -C <worktree 路径> 指定已登记的专用 worktree。
2. auto 表示在前置条件满足且没有其他限制时自行执行；信息不足仍需澄清。ask 表示复用范围内的明确授权，没有授权时先准备可检查的结果，再询问。

3. 工作远端取 repo.remote.name，仓库身份按 repo.remote.url 核对，包括实际 push 地址。推送明确指定源分支与远端同名分支，限制在本任务授权范围；


4. 操作前核对任务所属目录、分支和文件范围，保留用户及并行任务的改动。

5. 继续任务时沿用原目标分支、起始提交点及适用的 Issue，核对当前状态和已有结果，按既定流程完成剩余工作；仅沿用仍有效的结果，不重复已完成的操作。中断待续时保留开发现场。

6. 提交消息（含合并产生的提交消息）优先遵循仓库约定；未约定时采用 Conventional Commits。标题简述具体改动，必要时补充原因与影响，并明确标记破坏性变更。
'''

