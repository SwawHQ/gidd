# 本仓库的工具存储配置；不表示启用 GIDD 或完成 GitHub 登录。
schema_version = 1

[tools]
# 工具固定存放于 ~/.agents/skills.tools/gidd/，开发入口与技能共用。
# 下载来源可核对或改为镜像；安装时展示确切版本和完整地址，并校验文件。
# Bun 稳定版与 Node LTS 由内部下载策略决定；兼容性只在 bootstrap 检查。
node = { source = "https://nodejs.org/dist" }
bun = { source = "https://github.com/oven-sh/bun/releases" }
gh = { source = "https://github.com/cli/cli/releases" }

[github]
hostname = "github.com"
account = "bornwhy"
remote = "origin"
