# Doctor catalog. Check IDs are stable registry keys, never module paths.
# Only declared checks with enabled = true run. Others remain visible as not_checked.
# Disabled or undeclared checks make the report incomplete (exit 1).
# --offline always skips network checks; disabled prerequisites are not re-enabled.
# Tables, single-line quoted strings, booleans and string arrays are supported.
# Reasons match exactly, then by longest prefix ending in *. Per-check rules win.
# Templates: {id}, {reason}, {blocked_by}, {config_key}, {configured}, {repository}.
# Commands are suggestions only. Arguments stay arrays and are never evaluated.
# Executables: link = skill gidd.cmd, ensure = tools.ensure.cmd, git = bound Git.
# 中英文提示共用检查开关和命令；检查 ID 是注册键，不是模块路径。
# 仅执行已声明且 enabled = true 的检查；禁用或未声明会导致检查不完整（退出码 1）。
# --offline 始终跳过联网检查；禁用的前置检查不会被自动重新启用。
# Text pairs require en and zh-CN with matching placeholders; commands are shared.
# 文本必须成对提供 en 和 zh-CN，且占位符一致；命令定义共用。
# --lang > config ui.language > system locale; zh variants use zh-CN.
# 语言优先级：--lang > 配置 ui.language > 系统语言；中文变体使用 zh-CN。
schema_version = 1

[defaults]
hint.en = "Inspect this check's details, repair the reported problem, then rerun doctor."
hint.zh-CN = "请查看此检查的 details，修复报告的问题后重新运行 doctor。"
commands = []

[report]
needs_attention.en = 'Resolve checks with severity "error", then rerun doctor.'
needs_attention.zh-CN = "请解决 severity 为 \"error\" 的检查项，然后重新运行 doctor。"
local_ready.en = "No local errors found."
local_ready.zh-CN = "本地检查未发现错误。"
checks_passed.en = "No errors found in local or online checks."
checks_passed.zh-CN = "本地和联网检查均未发现错误。"
checks_incomplete.en = "No errors found, but some checks are disabled, undeclared or unverified."
checks_incomplete.zh-CN = "未发现错误，但部分检查已禁用、未声明或尚未验证。"
online_incomplete.en = "No errors found, but some online checks remain unverified."
online_incomplete.zh-CN = "未发现错误，但部分联网检查尚未验证。"
warning.en = 'Review checks with severity "warning".'
warning.zh-CN = "请查看 severity 为 \"warning\" 的检查项。"
offline.en = "Online checks were not run."
offline.zh-CN = "未执行联网检查。"
push.en = "Push permission is not checked."
push.zh-CN = "未检查推送权限。"

[reasons."offline"]
hint.en = "Not checked in offline mode. Run doctor without --offline to check GitHub identity and HTTPS remote access."
hint.zh-CN = "离线模式下未检查。请去掉 --offline 后运行 doctor，以检查 GitHub 身份和 HTTPS 远端访问。"
commands = []

[reasons."disabled"]
hint.en = "This check is disabled in references/doctor.toml. Enable {id} to include it."
hint.zh-CN = "此检查已在 references/doctor.toml 中禁用。请启用 {id} 以执行检查。"
commands = []

[reasons."not_declared"]
hint.en = "This check is not declared in references/doctor.toml. Declare and enable {id} to include it."
hint.zh-CN = "此检查未在 references/doctor.toml 中声明。请声明并启用 {id} 以执行检查。"
commands = []

[reasons."dependency_unavailable"]
hint.en = "Resolve the {blocked_by} check, then rerun doctor."
hint.zh-CN = "请先解决 {blocked_by} 检查项的问题，然后重新运行 doctor。"
commands = []

[commands."ensure"]
executable = "ensure"
args = []

[commands."remotes"]
executable = "git"
args = ["-C","{repository}","remote","-v"]

[commands."set_language"]
executable = "link"
args = ["lang.set","<zh|en>"]

[commands."clear_language"]
executable = "link"
args = ["lang.clear"]

[commands."flow_deliveries"]
executable = "link"
args = ["flow.deliveries"]

[commands."flow_list"]
executable = "link"
args = ["flow.list","<mode-id>"]
required_inputs = ["mode-id"]

[commands."flow_read"]
executable = "link"
args = ["flow","<mode-id>/<name>"]
required_inputs = ["flow"]

[checks."tool.platform"]
enabled = true
hint.en = "Use the currently supported Windows x64 platform."
hint.zh-CN = "请使用当前支持的 Windows x64 平台。"

[checks."tool.js_runtime"]
enabled = true

[checks."tool.git"]
enabled = true
hint.en = "Run tools.ensure.cmd to repair shared tools."
hint.zh-CN = "请运行 tools.ensure.cmd，修复共享工具。"
commands = ["ensure"]

[checks."tool.gh"]
enabled = true
hint.en = "Run tools.ensure.cmd to repair shared tools."
hint.zh-CN = "请运行 tools.ensure.cmd，修复共享工具。"
commands = ["ensure"]

[checks."folder.git.worktree"]
enabled = true
hint.en = "Check the reported directory and its Git working-tree metadata. Restore the intended repository or explicitly initialize Git there, then rerun doctor; do not substitute a parent repository."
hint.zh-CN = "请检查报告的目录及其 Git 工作区元数据。恢复目标仓库或明确在该目录初始化 Git 后，重新运行 doctor；不要用上级仓库替代。"

[checks."folder.git.worktree".reasons."unborn_branch"]
hint.en = "This repository has no commits yet. Create the first commit when there is work to save; local configuration can continue."
hint.zh-CN = "此仓库尚无提交。有需要保存的工作时再创建首次提交；当前可以继续本地配置。"

[checks."folder.git.worktree".reasons."head_unreadable"]
hint.en = "Repair the repository HEAD, then rerun doctor."
hint.zh-CN = "请修复仓库 HEAD，然后重新运行 doctor。"

[checks."folder.git.worktree".reasons."target_required"]
hint.en = "Run the skill gidd.cmd from the target repository or one of its worktrees."
hint.zh-CN = "请在目标仓库或其工作树中，通过技能安装路径调用 gidd.cmd。"

[checks."folder.git.identity"]
enabled = true
hint.en = "Check effective Git author and committer. Configure user.name and user.email through Git."
hint.zh-CN = "请检查实际生效的 Git 作者和提交者身份，并通过 Git 配置 user.name 和 user.email。"

[checks."config.toml"]
enabled = true
hint.en = "Repair config.toml at the reported path, preserving unrelated settings and comments, then rerun doctor. Invalid values are omitted from this report."
hint.zh-CN = "请修复报告路径下的 config.toml，保留无关设置和注释，然后重新运行 doctor。报告中已省略无效值。"

[checks."config.toml".reasons."config_*"]
hint.en = "Use the error code to repair config.toml at the reported path, then rerun doctor."
hint.zh-CN = "请根据错误代码修复报告路径下的 config.toml，然后重新运行 doctor。"


[checks."config.ui.language"]
enabled = true
hint.en = "Use lang.set to choose zh or en, or lang.clear to use the system language."
hint.zh-CN = "请用 lang.set 设置 zh 或 en；也可用 lang.clear 恢复按系统语言选择。"
commands = ["set_language","clear_language"]


[checks."folder.gidd"]
enabled = true
hint.en = "Inspect the reported data directory and gidd-wt worktree paths, ownership and Git registrations. Resolve inconsistencies manually before retrying."
hint.zh-CN = "请检查报告中的数据目录及 gidd-wt 工作树路径、归属和 Git 登记，人工处理不一致项后重试。"

[checks."folder.gidd".reasons."data_missing"]
hint.en = "The fixed data directory is absent or empty. Authorizing an account or registering an Issue creates it when needed. If the repository or data was moved or deleted, inspect existing resources first."
hint.zh-CN = "固定数据目录不存在或为空。登录账号或登记 Issue 时，会按需创建该目录。若曾移动或删除仓库及数据，请先检查现有资源。"



[checks."folder.gidd.flow"]
enabled = true
hint.en = "Inspect details.path and details.field; repair the task flow, mode description.toml, step guidance or Issue template, then rerun doctor."
hint.zh-CN = "请查看 details.path 和 details.field，修复任务工作流程、交付模式 description.toml 或其依赖的环节经验及 Issue 模板，然后重新运行 doctor。"

[checks."folder.gidd.flow".reasons."flow_mode_id_conflict"]
hint.en = "Mode directory prefixes must be unique. Rename the conflicting directories listed in details.conflicts, then rerun doctor."
hint.zh-CN = "交付模式目录的编号前缀必须唯一。请重命名 details.conflicts 列出的冲突目录，然后重新运行 doctor。"

[checks."folder.gidd.flow".reasons."flow_mode_name_conflict"]
hint.en = "A delivery mode must have exactly one directory. Resolve the duplicate mode names in details.conflicts, then rerun doctor."
hint.zh-CN = "同一种交付模式只能对应一个目录。请处理 details.conflicts 列出的重复交付模式目录，然后重新运行 doctor。"

[checks."folder.gidd.flow".reasons."flow_mode_directory_invalid"]
hint.en = "Use a two-digit prefix and supported mode name for each mode directory, such as 00.direct-commit."
hint.zh-CN = "交付模式目录使用两位数字前缀及受支持的交付模式名，例如 00.direct-commit。"

[checks."folder.gidd.flow".reasons."flow_mode_missing"]
hint.en = "Run gidd flow.deliveries to find the current directory IDs, then select an existing delivery mode and authorization preset."
hint.zh-CN = "请运行 gidd flow.deliveries 查看当前目录编号，再选择已有的交付模式和授权方案。"
commands = ["flow_deliveries","flow_list","flow_read"]

[checks."folder.gidd.flow".reasons."flow_number_missing"]
hint.en = "Run gidd flow.list <mode-id> and select a preset number or complete name shown there."
hint.zh-CN = "请运行 gidd flow.list <mode-id>，选择列表中存在的授权方案编号或完整名称。"
commands = ["flow_list","flow_read"]

[checks."folder.gidd.flow".reasons."flow_number_ambiguous"]
hint.en = "Multiple presets have this number. Give them unique prefixes or select a complete preset name."
hint.zh-CN = "多份授权方案使用了同一编号。请将授权方案前缀改为唯一编号，或用完整授权方案名明确选择。"

[checks."folder.gidd.flow".reasons."flow_history_invalid"]
hint.en = "Inspect flow-history.jsonl in the local data directory and correct its reported structure. Task records remain separate."
hint.zh-CN = "请检查本地数据目录中的 flow-history.jsonl，修正记录格式。任务记录独立保存。"

[checks."folder.gidd.flow".reasons."flow_language_unavailable"]
hint.en = "The selected flow has no complete language. Complete its mode description and titles for existing guidance, or choose an available flow."
hint.zh-CN = "所选工作流程尚无完整可用的语言。请补齐交付模式简介及已有正文的标题，或选择可用的工作流程。"

[checks."tool.gh.account..online"]
enabled = true
hint.en = "Check connectivity and the repository account credentials for the delivery host. A failed API request does not prove login is required."
hint.zh-CN = "请检查网络连接，以及本仓库账号在交付主机上的凭据。API 请求失败并不一定表示需要登录。"

[checks."tool.gh.account..online".reasons."unexpected_account"]
hint.en = "The credential identity differs from the task account. Check the task record and gh credentials."
hint.zh-CN = "凭据身份与任务账号不一致。请检查任务记录和 gh 凭据。"

[checks."tool.gh.account..online".reasons."gh_auth_required"]
hint.en = "Run gidd gh.auth to select this repository’s account."
hint.zh-CN = "请运行 gidd gh.auth，选择本仓库的账号。"

[checks."tool.gh.account..online".reasons."account_token_unavailable"]
hint.en = "Run gidd gh.auth to authorize this repository’s account."
hint.zh-CN = "请运行 gidd gh.auth，为本仓库的账号授权。"

[checks."folder.git.remote..online"]
enabled = true
hint.en = "Inspect details.gh_remote_read and details.git_fetch_read and details.git_push_read. Skipped checks remain unverified; Git reading and API reading do not prove write permission."
hint.zh-CN = "请查看 details.gh_remote_read 和 details.git_fetch_read、details.git_push_read。已跳过的检查仍未验证；Git 和 API 的读取成功不能证明具有写入权限。"

[checks."folder.git.remote"]
enabled = true
hint.en = "Inspect Git remotes and target branch settings. Use for.swaw.gidd to select a separate delivery remote with one fetch URL and at most one push URL."
hint.zh-CN = "请检查 Git 远端和目标分支配置。需要为 GIDD 单独选择远端时，可配置 for.swaw.gidd，其中使用一个 url 和至多一个 pushurl。"
commands = ["remotes"]

[checks."folder.gidd.remote"]
enabled = true
hint.en = "The remote selection differs from an active task. Inspect its recorded fetch source and delivery target before changing Git configuration."
hint.zh-CN = "当前远端选择与未结束的任务记录不一致。请先核对任务记录中的读取来源和交付目标，再调整 Git 配置。"
commands = ["remotes"]
