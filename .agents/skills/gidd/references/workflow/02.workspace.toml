[zh-CN."*"]
title = "工作目录准备"
body = '''
确认当前规范和目标仓库当前分支符合本次交付安排，再执行 `gidd.link workflow.workspace <Issue编号>`。命令首次在线核验 Issue 及目标分支；本地落后时安全快进，领先或分叉时停止并报告。随后保存交付模式、目标分支和更新后的起始提交点。远端尚无目标分支时，仅直接交付模式可继续。
直接提交使用目标仓库；合并模式新建 `codex/issue-<编号>` 开发分支并领用专用 worktree。
记录返回的 Issue、目标仓库、目标分支、开发分支、工作目录和起始提交点，供后续报告使用。
继续任务先确认原使用者已停止操作，再执行 `workflow.workspace --resume <Issue编号>`，离线核对本地记录与 Git 状态；沿用原交付模式及分支。查找和排查使用 `worktree.list`、`worktree.show <目录>`；原目录已释放、移除或复用时，先确定继续方式。
'''

