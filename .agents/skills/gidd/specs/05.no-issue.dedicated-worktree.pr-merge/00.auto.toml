[authorization]
development         = "auto"           # 开发
internal_acceptance = "auto"           # 内部验收，准备交付
add                 = "auto"           # 暂存
commit              = "auto"           # 提交
direct_merge        = "not_applicable" # 本地合并
direct_merge_error  = "not_applicable" # 处理本地合并阻碍
push                = "auto"           # 推送
push_error          = "auto"           # 处理推送阻碍
pr_merge            = "auto"           # PR 合并
pr_merge_error      = "auto"           # 处理 PR 合并阻碍
close_issue         = "not_applicable" # 显式关闭 Issue
cleanup_sync        = "auto"           # 清理和同步
