# Copy to <repository>/.agents/skills/gidd/config.toml.
# Repository settings; this file does not enable GIDD or authenticate GitHub.
schema_version = 1

[tools]
# Recommended dedicated tools directory; ~ means the current OS user's home.
directory = "~/.agents/skills/gidd.tools"
# Release/download roots. Installation reports the exact version and archive URL.
# node: lts/latest or an exact version; bun/gh: latest or an exact version.
# Floating versions are resolved only when downloading a missing tool.
node = { version = "lts", source = "https://nodejs.org/dist" }
bun = { version = "latest", source = "https://github.com/oven-sh/bun/releases" }
gh = { version = "latest", source = "https://github.com/cli/cli/releases" }

# Repository-relative example:
# directory = ".devv"
# Absolute Windows example:
# directory = "D:/tools/gidd"
# Skill installation is managed by the Agent, independently of this tools path.
# Custom mirrors must preserve the upstream download layout; hashes come from upstream.

[github]
# Expected identity and Git remote; these are not credentials or commit author settings.
hostname = "github.com"
# Set explicitly before identity/auth: gidd.cmd config set github.account YOUR_LOGIN
# account = "YOUR_LOGIN"
remote = "origin"
