title = "公共执行规则"
body = '''
1. 使用本工作目录的 gidd.link .git、gidd.link .gh 操作 Git 和 GitHub
2. auto 表示在前置条件满足且没有其他限制时自行执行；信息不足仍需澄清。ask 表示复用范围内的明确授权，没有授权时先准备可检查的结果，再询问。

3. 工作远端取 repo.remote.name，仓库身份按 repo.remote.url 核对，包括实际 push 地址。推送明确指定源分支与远端同名分支，限制在本任务授权范围；


4. 操作前核对任务所属目录、分支和文件范围，保留用户及并行任务的改动。

5. 操作前，查询是否有 仍未结束的 worktree
