[zh-CN."*.current-worktree.*"]
title = "工作目录准备"
body = '''
在任务开始时的工作目录及其当前本地分支上工作，不另建专用 worktree 或开发分支；将该分支记录为目标分支和工作分支，保存来源目录及起始提交，继续任务时沿用记录。
留意已有改动、并行任务及当前目录的 GIDD 配置是否适用。
说明实际工作目录和比较基准，便于用户查看改动。
'''

[zh-CN."*.dedicated-worktree.*"]
title = "工作目录准备"
body = '''
将任务开始时来源工作目录的当前本地分支记录为目标分支，保存来源目录和起始提交。
从该分支为本任务新建专用开发分支，并创建检出该分支的专用 worktree，两者一对一供本任务使用。记录 worktree 路径和专用分支名，供继续开发、交付和配套清理使用。
继续任务时沿用已记录的专用分支及仍需使用的工作区；并行任务各自使用独立的专用分支和 worktree。
采用 PR 合并时，先确认配置工作远端已有同名目标分支，不自动改用远端默认分支；新建专用开发分支时，也确认其名称未被远端已有分支占用，确保后续推送和清理的远端同名开发分支属于本任务。
留意已有改动、并行任务及当前目录的 GIDD 配置是否适用。
提供专用 worktree 的路径和比较基准，便于用户查看改动。
'''

