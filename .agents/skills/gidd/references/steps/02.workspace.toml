[zh-CN."*"]
title = "工作区准备"
body = '''
`gidd issue --file <文件> --flow <工作流程>` 和 `gidd <Issue编号> --flow <工作流程>` 都会在登记任务后准备工作区。准备中断时，重复执行编号命令继续；已有工作区时返回其状态。命令沿用任务约定；目标分支落后于读取来源时，会先快进更新。

直接提交使用目标仓库目录作为工作区；合并模式新建 `gidd-issue-<Issue编号>` 工作分支，并领用专用工作树作为工作区。
命令成功后，在返回的 `workspace.path` 中开展工作。

接续其他 Agent 或进程留下的任务前，确认其已停止操作。用 `gidd <Issue编号>` 离线核对任务记录与 Git 状态，并取得原工作区的位置。查找其他工作树用 `gidd worktree.list`，查看某个工作区用 `gidd worktree.show <目录>`。
'''

