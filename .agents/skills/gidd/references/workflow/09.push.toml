[zh-CN."direct-commit"]
title = "push"
body = '''
执行 `gidd.link workflow.push <Issue编号>`，将本地目标分支推送到工作远端的同名分支，包含全部已提交内容，不推送其他分支或标签。
受阻时进入 push_error 环节处理。
'''

[zh-CN."direct-merge"]
title = "push"
body = '''
确认开发成果已合入本地目标分支后，执行 `gidd.link workflow.push <Issue编号>`；命令按记录将目标分支推送到工作远端的同名分支，包含全部已提交内容，不推送其他分支或标签。
受阻时进入 push_error 环节处理。
'''

[zh-CN."pr-merge"]
title = "push"
body = '''
