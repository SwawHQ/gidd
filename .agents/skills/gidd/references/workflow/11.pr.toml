[zh-CN."issue.*pr-merge"]
title = "PR"
body = '''
开发分支同名推送到工作远端后，创建或更新指向目标分支的 PR。
PR 的目标是任务记录中的本地目标分支在工作远端的同名分支，该远端分支应已存在，不自动改用远端默认分支。
说明本批改动和验收情况，仅使用 Refs #NNN 关联 Issue，并提供 PR 链接。
'''

