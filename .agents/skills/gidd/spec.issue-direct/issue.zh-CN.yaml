name: 开发任务（中文）
description: 按 issue-direct 规范记录开发任务。
body:
  - type: textarea
    id: goal
    attributes:
      label: 目标
      placeholder: 说明要解决的问题，以及期望得到的结果。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围
      placeholder: 列出本次需要完成的改动和明确不包含的工作。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 将示例替换为可验证的结果，每项使用 Markdown 勾选条目。
      value: |-
        - [ ] 可验证的结果一
        - [ ] 可验证的结果二
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 验证方式
      placeholder: 填写测试命令或检查方法，以及预期结果。
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: 完成记录
      description: 交付后补充目标分支、远程提交标识、验证结果和剩余事项。全部验收条件满足后再关闭。
    validations:
      required: false
